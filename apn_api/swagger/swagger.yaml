openapi: 3.0.0
info:
  title: APN Pilates API REST
  description: |
    API REST para el sistema APN Pilates
    
    ## Autenticación
    
    Para usar los endpoints protegidos, debes incluir el token en el header:
    `Authorization: Bearer TU_TOKEN_AQUI`
    
    ## Flujo de uso
    
    1. Obtén un token mediante el endpoint `/api_pilates/v1/login`
    2. Usa ese token en los demás endpoints en el header Authorization

  version: 1.0.0
  contact:
    name: APN Pilates
    email: soporte@apnpilates.com
  license:
    name: LGPL-3.0

servers:
  - url: http://localhost:8069
    description: Servidor de desarrollo

security:
  - BearerAuth: []

paths:
  /api_pilates/v1/status:
    get:
      tags:
        - Sistema
      summary: Estado de la API
      description: Verifica que la API está funcionando correctamente
      security: []
      responses:
        '200':
          description: API funcionando correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      api_version:
                        type: string
                        example: "1.0"
                      status:
                        type: string
                        example: "operational"
              example:
                success: true
                message: "OK"
                data:
                  api_version: "1.0"
                  odoo_version: "18.0"
                  status: "operational"

  /api_pilates/v1/login:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión
      description: |
        Autentica al usuario y genera un token JWT para usar en los demás endpoints.
        
        **Importante:**
        - Este endpoint **NO** requiere token
        - Siempre genera un nuevo token, invalidando cualquier token anterior
        - El token tiene una duración configurable (por defecto 12 horas)
        - Registra el dispositivo para notificaciones push si se envía `token_fmc`
        - Analiza automáticamente el User-Agent para identificar el dispositivo
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - login
                - password
                - token_fmc
              properties:
                login:
                  type: string
                  description: Email o nombre de usuario
                  example: "usuario@apnpilates.com"
                password:
                  type: string
                  format: password
                  description: Contraseña del usuario
                  example: "MiPassword123"
                token_fmc:
                  type: string
                  description: Token de Firebase Cloud Messaging para notificaciones push. Enviar cadena vacía si no desea notificaciones.
                  example: "fMC_token:APA91bH3k4j5..."
            examples:
              con_notificaciones:
                summary: Login con notificaciones push
                value:
                  login: "maria@apnpilates.com"
                  password: "Maria2024!"
                  token_fmc: "fMC_token:APA91bH3k4j5l8m9..."
              sin_notificaciones:
                summary: Login sin notificaciones
                value:
                  login: "juan@apnpilates.com"
                  password: "Juan2024!"
                  token_fmc: ""
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: ID del usuario
                        example: 42
                      name:
                        type: string
                        description: Nombre completo del usuario
                        example: "María García"
                      login:
                        type: string
                        description: Login/email del usuario
                        example: "maria@apnpilates.com"
                      token:
                        type: string
                        description: Token JWT para autenticación
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      token_expiration:
                        type: string
                        description: Fecha de expiración del token
                        example: "2024-01-02 12:00:00"
                      partner:
                        type: array
                        description: Datos del contacto asociado (res.partner)
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 10
                            name:
                              type: string
                              example: "Soporte Técnico APN Pilates"
                  message:
                    type: string
                    example: "Sesión iniciada exitosamente"
              example:
                status: "success"
                user:
                  id: 42
                  name: "María García"
                  login: "maria@apnpilates.com"
                  token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjo0MiwibG9naW4iOiJtYXJpYS5nYXJjaWFAZWplbXBsby5jb20iLCJleHAiOjE3MDQxOTY0MDAsImlhdCI6MTcwNDExNjQwMH0.abc123..."
                  token_expiration: "2024-01-02 12:00:00"
                  partner:
                    - id: 10
                      name: "María García"
                message: "Sesión iniciada exitosamente"
        '400':
          description: Datos inválidos o faltantes
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "error"
                  message:
                    type: string
                  data:
                    type: object
                    nullable: true
                  pagination:
                    type: object
                    nullable: true
              examples:
                parametros_faltantes:
                  summary: Parámetros faltantes
                  value:
                    status: "error"
                    message: "Falta el parámetro: login"
                    data: null
                    pagination: null
                credenciales_invalidas:
                  summary: Credenciales incorrectas
                  value:
                    status: "error"
                    message: "Invalid credentials"
                    data:
                      type: "AccessDenied"
                      message: "Invalid credentials"
                      file: ".../auth.py"
                      line: 123
                      function: "login"
                      text: "raise AccessDenied(_('Invalid credentials'))"
                    pagination: null
        '403':
          description: Usuario inactivo o bloqueado
          content:
            application/json:
              example:
                status: "error"
                message: "El usuario 'María García' no está activo. Contacte al administrador para activar esta cuenta."
                data: null
                pagination: null
        '500':
          description: Error interno del servidor
          content:
            application/json:
              example:
                status: "error"
                message: "Error interno del servidor"
                data:
                  type: "InternalError"
                  message: "Descripción del error"
                pagination: null

  /api_pilates/v1/logout:
    post:
      tags:
        - Autenticación
      summary: Cerrar sesión
      description: |
        Invalida el token JWT actual del usuario.
        
        **Comportamiento:**
        - Busca el token en la base de datos y lo elimina
        - Si el token está expirado pero es válido, igualmente limpia la sesión
        - No requiere que el token esté activo para procesar el logout
        
        **Importante:** El token JWT debe enviarse en el header `Authorization: Bearer TU_TOKEN`
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: El body puede ser un objeto vacío o contener datos adicionales
              example: { }
      responses:
        '200':
          description: Logout exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                  data:
                    type: object
                    nullable: true
                  pagination:
                    type: object
                    nullable: true
              examples:
                logout_exitoso:
                  summary: Sesión cerrada correctamente
                  value:
                    status: "success"
                    message: "Sesión cerrada correctamente"
                    data: null
                    pagination: null
                logout_token_expirado:
                  summary: Sesión cerrada (token expirado)
                  value:
                    status: "success"
                    message: "Sesión cerrada correctamente (token expirado)"
                    data: null
                    pagination: null
        '400':
          description: Token no proporcionado o inválido
          content:
            application/json:
              examples:
                sin_autorizacion:
                  summary: Header de autorización faltante
                  value:
                    status: "error"
                    message: "Encabezado de autorización inválido"
                    data: null
                    pagination: null
                token_invalido:
                  summary: Token inválido
                  value:
                    status: "error"
                    message: "Token inválido"
                    data: null
                    pagination: null
                usuario_no_encontrado:
                  summary: Usuario no encontrado
                  value:
                    status: "error"
                    message: "Usuario no encontrado en el sistema"
                    data: null
                    pagination: null
        '500':
          description: Error interno del servidor
          content:
            application/json:
              example:
                status: "error"
                message: "Error interno del servidor"
                data: null
                pagination: null

  /api_pilates/v1/profile_user:
    post:
      tags:
        - Usuario
      summary: Obtener perfil del usuario autenticado
      description: |
        Devuelve la información del perfil del usuario cuyo token JWT se envía en la cabecera.
        
        **Campos incluidos:**
        - `id`, `name`, `login`, `active`
        - `apn_groups`: lista de grupos de seguridad a los que pertenece
        - `email`, `mobile`
        - `partner`: datos de la ficha de contacto asociada
        
        **Requerimientos:**
        - Token JWT válido en `Authorization: Bearer <token>`
        - El token debe estar activo y pertenecer a un usuario existente
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Sin parámetros obligatorios. Puede enviarse un objeto vacío.
              example: {}
      responses:
        '200':
          description: Perfil obtenido exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Perfil obtenido exitosamente"
                  data:
                    $ref: '#/components/schemas/UserProfile'
              example:
                status: "success"
                message: "Perfil obtenido exitosamente"
                data:
                  id: 9
                  name: "Soporte Técnico APN Pilates"
                  login: "soporte@apnpilates.com"
                  active: true
                  apn_groups:
                    - id: 64
                      name: "APN Pilates Administrator"
                    - id: 65
                      name: "APN Pilates Technical Support"
                    - id: 71
                      name: "Client"
                  email: false
                  mobile: false
                  partner:
                    - id: 10
                      name: "Soporte Técnico APN Pilates"
        '401':
          description: Token no proporcionado, inválido o expirado
          content:
            application/json:
              examples:
                token_faltante:
                  summary: Token no enviado
                  value:
                    status: "error"
                    message: "Encabezado de autorización inválido"
                    data: null
                    pagination: null
                token_expirado:
                  summary: Token expirado
                  value:
                    status: "error"
                    message: "Token has expired. Please login again."
                    data: null
                    pagination: null
                token_invalido:
                  summary: Token inválido
                  value:
                    status: "error"
                    message: "Invalid authentication token."
                    data: null
                    pagination: null
        '403':
          description: Usuario inactivo o bloqueado
          content:
            application/json:
              example:
                status: "error"
                message: "El usuario '...' no está activo. Contacte al administrador para activar esta cuenta."
                data: null
                pagination: null
        '500':
          description: Error interno del servidor
          content:
            application/json:
              example:
                status: "error"
                message: "Error interno del servidor"
                data: null
                pagination: null

  /api_pilates/v1/branches:
    post:
      tags:
        - Sucursales
      summary: Listar todas las sucursales activas
      description: |
        Obtiene una lista paginada de sucursales activas con toda su información relacionada.
        
        **Parámetros del cuerpo (opcionales):**
        - `page`: número de página (por defecto 1)
        - `limit`: elementos por página (por defecto 80)
        
        **Información incluida por sucursal:**
        - Datos generales (nombre, dirección, contacto)
        - Ubicación geográfica (latitud, longitud, enlace a Google Maps)
        - Logo de la sucursal (indicador y URL de descarga)
        - Salas disponibles con sus capacidades
        - Horarios de operación con días y horas
        
        **Nota sobre el logo:**
        - `logo`: indica si la sucursal tiene un logo configurado (true/false)
        - `logo_url`: URL completa para descargar la imagen del logo (null si no tiene logo)
        
        **Nota sobre los horarios:**
        - Los días se representan: 0=Lunes, 1=Martes, 2=Miércoles, 3=Jueves, 4=Viernes, 5=Sábado, 6=Domingo
        - Las horas están en formato 24h decimal (ej: 6.5 = 06:30, 17.5 = 17:30)
        - Un horario puede cubrir un rango de días (ej: Lunes a Viernes) o un solo día (ej: Solo Sábado)
        - Si `hour_to` es menor que `hour_from`, el horario cruza al día siguiente
      security: [ ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                page:
                  type: integer
                  description: Número de página a recuperar
                  example: 1
                  minimum: 1
                limit:
                  type: integer
                  description: Cantidad de elementos por página
                  example: 80
                  minimum: 1
            example:
              page: 1
              limit: 80
      responses:
        '200':
          description: Lista de sucursales obtenida exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Datos obtenidos correctamente"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Branch'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              example:
                status: "success"
                message: "Datos obtenidos correctamente"
                data:
                  - id: 3
                    name: "Sucursal A"
                    latitude: 20.6648948
                    longitude: -103.3938723
                    map_url: "https://www.google.com/maps?q=20.6648948,-103.3938723"
                    city: "Guadalajara"
                    phone: "(33) 1598 2647"
                    email: false
                    website: false
                    street: "Av. López Mateos Sur 4450"
                    street2: false
                    logo: true
                    logo_url: "http://localhost:8069/public/image/branch/3"
                    state:
                      id: 498
                      name: "Jalisco"
                    zip: "45040"
                    country:
                      id: 156
                      name: "Mexico"
                    parent_company:
                      id: 1
                      name: "Pilates"
                    reference: false
                    room_count: 3
                    rooms:
                      - id: 2
                        name: "Sala Cadillac"
                        capacity: 40
                      - id: 1
                        name: "Sala Flow"
                        capacity: 30
                      - id: 3
                        name: "Sala Wunda"
                        capacity: 25
                    schedules:
                      - id: 1
                        day_of_week_from: "0"
                        day_of_week_from_label: "Monday"
                        day_of_week_to: "4"
                        day_of_week_to_label: "Friday"
                        hour_from: 6
                        hour_to: 7
                      - id: 6
                        day_of_week_from: "0"
                        day_of_week_from_label: "Monday"
                        day_of_week_to: "4"
                        day_of_week_to_label: "Friday"
                        hour_from: 13
                        hour_to: 14
                pagination:
                  page: 1
                  limit: 80
                  total_items: 6
                  total_pages: 1
                  offset: 0
        '400':
          description: Error en los parámetros (ej. página o límite no numéricos)
          content:
            application/json:
              example:
                status: "error"
                message: "Error en los parámetros"
                data: null
                pagination: null
        '500':
          description: Error interno del servidor
          content:
            application/json:
              example:
                status: "error"
                message: "Error interno del servidor"
                data: null
                pagination: null

  /api_pilates/v1/accesories/:

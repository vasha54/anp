openapi: 3.0.0
info:
  title: APN Pilates API REST
  description: |
    API REST para el sistema APN Pilates
    
    ## Autenticación
    
    Para usar los endpoints protegidos, debes incluir el token en el header:
    `Authorization: Bearer TU_TOKEN_AQUI`
    
    ## Flujo de uso
    
    1. Obtén un token mediante el endpoint `/api_pilates/v1/login`
    2. Usa ese token en los demás endpoints en el header Authorization

  version: 1.0.0
  contact:
    name: APN Pilates
    email: soporte@apnpilates.com
  license:
    name: LGPL-3.0

servers:
  - url: http://localhost:8069
    description: Servidor de desarrollo

security:
  - BearerAuth: []

paths:
  # --------------------- Sistema ---------------------
  /api_pilates/v1/status:
    get:
      tags:
        - Sistema
      summary: Estado de la API
      description: Verifica que la API está funcionando correctamente
      security: []
      responses:
        '200':
          description: API funcionando correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      api_version:
                        type: string
                        example: "1.0"
                      status:
                        type: string
                        example: "operational"
              example:
                success: true
                message: "OK"
                data:
                  api_version: "1.0"
                  odoo_version: "18.0"
                  status: "operational"

  # --------------------- Autenticación ---------------------
  /api_pilates/v1/login:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión
      description: |
        Autentica al usuario y genera un token JWT para usar en los demás endpoints.
        
        **Importante:**
        - Este endpoint **NO** requiere token
        - Siempre genera un nuevo token, invalidando cualquier token anterior
        - El token tiene una duración configurable (por defecto 12 horas)
        - Registra el dispositivo para notificaciones push si se envía `token_fmc`
        - Analiza automáticamente el User-Agent para identificar el dispositivo
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - login
                - password
                - token_fmc
              properties:
                login:
                  type: string
                  description: Email o nombre de usuario
                  example: "usuario@apnpilates.com"
                password:
                  type: string
                  format: password
                  description: Contraseña del usuario
                  example: "MiPassword123"
                token_fmc:
                  type: string
                  description: Token de Firebase Cloud Messaging para notificaciones push. Enviar cadena vacía si no desea notificaciones.
                  example: "fMC_token:APA91bH3k4j5..."
            examples:
              con_notificaciones:
                summary: Login con notificaciones push
                value:
                  login: "maria@apnpilates.com"
                  password: "Maria2024!"
                  token_fmc: "fMC_token:APA91bH3k4j5l8m9..."
              sin_notificaciones:
                summary: Login sin notificaciones
                value:
                  login: "juan@apnpilates.com"
                  password: "Juan2024!"
                  token_fmc: ""
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: ID del usuario
                        example: 42
                      name:
                        type: string
                        description: Nombre completo del usuario
                        example: "María García"
                      login:
                        type: string
                        description: Login/email del usuario
                        example: "maria@apnpilates.com"
                      token:
                        type: string
                        description: Token JWT para autenticación
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      token_expiration:
                        type: string
                        description: Fecha de expiración del token
                        example: "2024-01-02 12:00:00"
                      partner:
                        type: array
                        description: Datos del contacto asociado (res.partner)
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 10
                            name:
                              type: string
                              example: "Soporte Técnico APN Pilates"
                  message:
                    type: string
                    example: "Sesión iniciada exitosamente"
              example:
                status: "success"
                user:
                  id: 42
                  name: "María García"
                  login: "maria@apnpilates.com"
                  token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjo0MiwibG9naW4iOiJtYXJpYS5nYXJjaWFAZWplbXBsby5jb20iLCJleHAiOjE3MDQxOTY0MDAsImlhdCI6MTcwNDExNjQwMH0.abc123..."
                  token_expiration: "2024-01-02 12:00:00"
                  partner:
                    - id: 10
                      name: "María García"
                message: "Sesión iniciada exitosamente"
        '400':
          description: Datos inválidos o faltantes
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "error"
                  message:
                    type: string
                  data:
                    type: object
                    nullable: true
                  pagination:
                    type: object
                    nullable: true
              examples:
                parametros_faltantes:
                  summary: Parámetros faltantes
                  value:
                    status: "error"
                    message: "Falta el parámetro: login"
                    data: null
                    pagination: null
                credenciales_invalidas:
                  summary: Credenciales incorrectas
                  value:
                    status: "error"
                    message: "Invalid credentials"
                    data:
                      type: "AccessDenied"
                      message: "Invalid credentials"
                      file: ".../auth.py"
                      line: 123
                      function: "login"
                      text: "raise AccessDenied(_('Invalid credentials'))"
                    pagination: null
        '403':
          description: Usuario inactivo o bloqueado
          content:
            application/json:
              example:
                status: "error"
                message: "El usuario 'María García' no está activo. Contacte al administrador para activar esta cuenta."
                data: null
                pagination: null
        '500':
          description: Error interno del servidor
          content:
            application/json:
              example:
                status: "error"
                message: "Error interno del servidor"
                data:
                  type: "InternalError"
                  message: "Descripción del error"
                pagination: null

  /api_pilates/v1/logout:
    post:
      tags:
        - Autenticación
      summary: Cerrar sesión
      description: |
        Invalida el token JWT actual del usuario.
        
        **Comportamiento:**
        - Busca el token en la base de datos y lo elimina
        - Si el token está expirado pero es válido, igualmente limpia la sesión
        - No requiere que el token esté activo para procesar el logout
        
        **Importante:** El token JWT debe enviarse en el header `Authorization: Bearer TU_TOKEN`
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: El body puede ser un objeto vacío o contener datos adicionales
              example: { }
      responses:
        '200':
          description: Logout exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                  data:
                    type: object
                    nullable: true
                  pagination:
                    type: object
                    nullable: true
              examples:
                logout_exitoso:
                  summary: Sesión cerrada correctamente
                  value:
                    status: "success"
                    message: "Sesión cerrada correctamente"
                    data: null
                    pagination: null
                logout_token_expirado:
                  summary: Sesión cerrada (token expirado)
                  value:
                    status: "success"
                    message: "Sesión cerrada correctamente (token expirado)"
                    data: null
                    pagination: null
        '400':
          description: Token no proporcionado o inválido
          content:
            application/json:
              examples:
                sin_autorizacion:
                  summary: Header de autorización faltante
                  value:
                    status: "error"
                    message: "Encabezado de autorización inválido"
                    data: null
                    pagination: null
                token_invalido:
                  summary: Token inválido
                  value:
                    status: "error"
                    message: "Token inválido"
                    data: null
                    pagination: null
                usuario_no_encontrado:
                  summary: Usuario no encontrado
                  value:
                    status: "error"
                    message: "Usuario no encontrado en el sistema"
                    data: null
                    pagination: null
        '500':
          description: Error interno del servidor
          content:
            application/json:
              example:
                status: "error"
                message: "Error interno del servidor"
                data: null
                pagination: null

  # --------------------- Usuario ---------------------
  /api_pilates/v1/profile_user:
    post:
      tags:
        - Usuario
      summary: Obtener perfil del usuario autenticado
      description: |
        Devuelve la información del perfil del usuario cuyo token JWT se envía en la cabecera.
        
        **Campos incluidos:**
        - `id`, `name`, `login`, `active`
        - `apn_groups`: lista de grupos de seguridad a los que pertenece
        - `email`, `mobile`
        - `partner`: datos de la ficha de contacto asociada
        - `google_profile_picture`: URL de la imagen de perfil de Google (si aplica)
        
        **Requerimientos:**
        - Token JWT válido en `Authorization: Bearer <token>`
        - El token debe estar activo y pertenecer a un usuario existente
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Sin parámetros obligatorios. Puede enviarse un objeto vacío.
              example: {}
      responses:
        '200':
          description: Perfil obtenido exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Perfil obtenido exitosamente"
                  data:
                    $ref: '#/components/schemas/UserProfile'
              example:
                status: "success"
                message: "Perfil obtenido exitosamente"
                data:
                  id: 9
                  name: "Soporte Técnico APN Pilates"
                  login: "soporte@apnpilates.com"
                  active: true
                  apn_groups:
                    - id: 64
                      name: "APN Pilates Administrator"
                    - id: 65
                      name: "APN Pilates Technical Support"
                    - id: 71
                      name: "Client"
                  email: false
                  mobile: false
                  google_profile_picture: null
                  partner:
                    - id: 10
                      name: "Soporte Técnico APN Pilates"
        '401':
          description: Token no proporcionado, inválido o expirado
          content:
            application/json:
              examples:
                token_faltante:
                  summary: Token no enviado
                  value:
                    status: "error"
                    message: "Encabezado de autorización inválido"
                    data: null
                    pagination: null
                token_expirado:
                  summary: Token expirado
                  value:
                    status: "error"
                    message: "Token has expired. Please login again."
                    data: null
                    pagination: null
                token_invalido:
                  summary: Token inválido
                  value:
                    status: "error"
                    message: "Invalid authentication token."
                    data: null
                    pagination: null
        '403':
          description: Usuario inactivo o bloqueado
          content:
            application/json:
              example:
                status: "error"
                message: "El usuario '...' no está activo. Contacte al administrador para activar esta cuenta."
                data: null
                pagination: null
        '500':
          description: Error interno del servidor
          content:
            application/json:
              example:
                status: "error"
                message: "Error interno del servidor"
                data: null
                pagination: null

  /api_pilates/v1/account_activate_email:
    post:
      tags:
        - Usuario
      summary: Activar cuenta mediante token enviado por email
      description: |
        Activa la cuenta de un usuario previamente registrado utilizando el token recibido en el correo de activación.
        
        **Requerimientos:**
        - `email`: debe corresponder al usuario que solicitó el registro.
        - `token`: token de activación enviado al email.
        
        **Posibles errores:**
        - Email no encontrado.
        - Token inválido, expirado o ya utilizado.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountActivateRequest'
            example:
              email: "cliente@example.com"
              token: "abc123def456..."
      responses:
        '200':
          description: Cuenta activada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Cuenta activada exitosamente. Ya puede iniciar sesión."
                  data:
                    $ref: '#/components/schemas/AccountActivateData'
              example:
                status: "success"
                message: "Cuenta activada exitosamente. Ya puede iniciar sesión."
                data:
                  id: 87
                  name: "María López"
                  email: "cliente@example.com"
                  is_activated: true
        '400':
          description: Error en la solicitud (parámetros faltantes, email no encontrado, token inválido)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "error"
                  message:
                    type: string
                  data:
                    type: object
                    nullable: true
                  pagination:
                    type: object
                    nullable: true
              examples:
                parametros_faltantes:
                  summary: Faltan email o token
                  value:
                    status: "error"
                    message: "Falta el parámetro: email"
                    data: null
                    pagination: null
                email_no_encontrado:
                  summary: No existe cuenta con ese email
                  value:
                    status: "error"
                    message: "No se encontró una cuenta con este email."
                    data: null
                    pagination: null
                token_invalido:
                  summary: Token incorrecto o expirado
                  value:
                    status: "error"
                    message: "El token de activación no es válido o ha expirado."
                    data: null
                    pagination: null
        '500':
          description: Error interno del servidor
          content:
            application/json:
              example:
                status: "error"
                message: "Error interno del servidor"
                data: null
                pagination: null

  /api_pilates/v1/register_client_by_email:
    post:
      tags:
        - Usuario
      summary: Registro de cliente por email
      description: |
        Permite a un nuevo cliente registrarse en la plataforma. Se envía un correo de activación.
        
        **Requerimientos:**
        - Email válido
        - Contraseña segura (mínimo 8 caracteres, mayúscula, minúscula, número y carácter especial)
        - `confirmed_password` debe coincidir con `password`
        - Nombre completo
        
        **Comportamiento especial:**
        - Si se proporciona `login`, se usa para buscar duplicados; si no, se usa el email.
        - Si ya existe un usuario con ese `login` (incluso inactivo) **y** la cuenta está activada, devuelve error.
        - Si ya existe un usuario con ese `login` **pero no está activado**, se reenvía el correo de activación y se retornan los datos del usuario existente (solo `id`, `name`, `login`).
        - Si no existe, se crea un nuevo usuario con el grupo `group_client`, se asigna a las compañías/sucursales disponibles y se envía el email de activación. En este caso la respuesta incluye `email`, `is_activated` y `activation_email_sent`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterClientRequest'
            example:
              email: "cliente@example.com"
              password: "Clave.123"
              confirmed_password: "Clave.123"
              name: "María López"
              mobile: "+34600123456"
      responses:
        '200':
          description: Registro exitoso (o reenvío de activación)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/UserRegistrationData'
              examples:
                nuevo_registro:
                  summary: Nuevo usuario creado
                  value:
                    status: "success"
                    message: "Registro exitoso. Revisa tu email para activar tu cuenta."
                    data:
                      id: 87
                      name: "María López"
                      email: "cliente@example.com"
                      is_activated: false
                      activation_email_sent: true
                reenvio_activacion:
                  summary: Usuario existente no activado – reenvío de correo
                  value:
                    status: "success"
                    message: "Ya existe una cuenta con este email pero no está activada. Se ha enviado un nuevo correo de activación."
                    data:
                      id: 85
                      name: "María López"
                      login: "maria.lopez"
        '400':
          description: Error de validación (email inválido, contraseña débil, email duplicado, etc.)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "error"
                  message:
                    type: string
                  data:
                    type: object
                    nullable: true
                  pagination:
                    type: object
                    nullable: true
              examples:
                email_invalido:
                  summary: Formato de email incorrecto
                  value:
                    status: "error"
                    message: "Formato de email inválido."
                    data: null
                    pagination: null
                password_debil:
                  summary: Contraseña no cumple requisitos
                  value:
                    status: "error"
                    message: "La contraseña debe tener al menos 8 caracteres, incluir mayúsculas, minúsculas, números y caracteres especiales."
                    data: null
                    pagination: null
                email_duplicado:
                  summary: El email/login ya está registrado y activado
                  value:
                    status: "error"
                    message: "Ya existe un usuario con este email."
                    data: null
                    pagination: null
        '500':
          description: Error interno del servidor
          content:
            application/json:
              example:
                status: "error"
                message: "Error interno del servidor"
                data: null
                pagination: null

  /api_pilates/v1/register_client_by_google:
    post:
      tags:
        - Usuario
      summary: Registro de cliente usando Google (OAuth)
      description: |
        Permite a un nuevo cliente registrarse utilizando un token de Google.
        Se envía un correo para restablecer/crear la contraseña.

        **Se debe proporcionar uno de estos parámetros:**
        - `id_token`: ID Token de Google (recomendado para aplicaciones móviles)
        - `access_token`: Access Token de Google

        **Comportamiento:**
        - Verifica el token con Google.
        - Si es válido, crea un nuevo usuario (o reactiva uno existente inactivo asociado al mismo email de Google).
        - Se asigna al grupo "Client" y a las sucursales disponibles.
        - Se envía un email para que el usuario establezca su contraseña.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id_token:
                  type: string
                  description: Token ID de Google (para autenticación en móvil)
                  example: "eyJhbGciOiJSUzI1NiIs..."
                access_token:
                  type: string
                  description: Token de acceso de Google (para autenticación en web)
                  example: "ya29.a0AfH6S..."
            examples:
              con_id_token:
                summary: Registro con ID Token (móvil)
                value:
                  id_token: "eyJhbGciOiJSUzI1NiIs..."
              con_access_token:
                summary: Registro con Access Token (web)
                value:
                  access_token: "ya29.a0AfH6S..."
      responses:
        '200':
          description: Registro exitoso (se envió email para crear contraseña)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Registro exitoso. Revisa tu email para cambiar tu contraseña, se ha enviado un código de restablecimiento."
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 100
                      name:
                        type: string
                        example: "María García"
                      email:
                        type: string
                        example: "maria@gmail.com"
                      login:
                        type: string
                        example: "maria@gmail.com"
                      change_password_email_sent:
                        type: boolean
                        example: true
              example:
                status: "success"
                message: "Registro exitoso. Revisa tu email para cambiar tu contraseña, se ha enviado un código de restablecimiento."
                data:
                  id: 100
                  name: "María García"
                  email: "maria@gmail.com"
                  login: "maria@gmail.com"
                  change_password_email_sent: true
        '400':
          description: Error de validación (token no proporcionado, token inválido, etc.)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "error"
                  message:
                    type: string
                  data:
                    type: object
                    nullable: true
                  pagination:
                    type: object
                    nullable: true
              examples:
                token_faltante:
                  summary: No se envió id_token ni access_token
                  value:
                    status: "error"
                    message: "Proporcione id_token o access_token."
                    data: null
                    pagination: null
                token_invalido:
                  summary: El token de Google no es válido
                  value:
                    status: "error"
                    message: "Token de Google inválido."
                    data: null
                    pagination: null
        '500':
          description: Error interno del servidor
          content:
            application/json:
              example:
                status: "error"
                message: "Error interno del servidor"
                data: null
                pagination: null

  /api_pilates/v1/change_password:
    post:
      tags:
        - Usuario
      summary: Cambiar contraseña (usuario autenticado)
      description: |
        Permite a un usuario autenticado cambiar su contraseña actual.
        
        **Requerimientos:**
        - Token JWT válido en `Authorization: Bearer <token>`
        - `password` y `confirmed_password` deben coincidir
        - La nueva contraseña debe cumplir la política de seguridad del sistema
        
        **Validaciones:**
        - El usuario debe estar activo y el token vigente.
        - Se aplican las reglas de complejidad de contraseña (mínimo 8 caracteres, mayúsculas, minúsculas, números y caracteres especiales).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              password: "Nueva.Clave1"
              confirmed_password: "Nueva.Clave1"
      responses:
        '200':
          description: Contraseña cambiada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "La contraseña se ha cambiado correctamente."
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/ChangePasswordResponseData'
              example:
                success: true
                message: "La contraseña se ha cambiado correctamente."
                data:
                  user:
                    id: 42
                    name: "María García"
                    login: "maria@apnpilates.com"
        '400':
          description: Error de validación (contraseñas no coinciden, contraseña débil, etc.)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "error"
                  message:
                    type: string
                  data:
                    type: object
                    nullable: true
                  pagination:
                    type: object
                    nullable: true
              examples:
                passwords_no_coinciden:
                  summary: Las contraseñas no coinciden
                  value:
                    status: "error"
                    message: "Las contraseñas no coinciden"
                    data: null
                    pagination: null
                password_debil:
                  summary: La nueva contraseña no cumple la política
                  value:
                    status: "error"

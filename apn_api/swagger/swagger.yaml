openapi: 3.0.0
info:
  title: APN Pilates API REST
  description: |
    API REST para el sistema APN Pilates
    
    ## Autenticación
    
    Para usar los endpoints protegidos, debes incluir el token en el header:
    `Authorization: Bearer TU_TOKEN_AQUI`
    
    ## Flujo de uso
    
    1. Obtén un token mediante el endpoint `/api_pilates/v1/login`
    2. Usa ese token en los demás endpoints en el header Authorization

  version: 1.0.0
  contact:
    name: APN Pilates
    email: soporte@apnpilates.com
  license:
    name: LGPL-3.0

servers:
  - url: http://localhost:8069
    description: Servidor de desarrollo

security:
  - BearerAuth: []

paths:
  /api_pilates/v1/status:
    get:
      tags:
        - Sistema
      summary: Estado de la API
      description: Verifica que la API está funcionando correctamente
      security: []
      responses:
        '200':
          description: API funcionando correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      api_version:
                        type: string
                        example: "1.0"
                      status:
                        type: string
                        example: "operational"
              example:
                success: true
                message: "OK"
                data:
                  api_version: "1.0"
                  odoo_version: "18.0"
                  status: "operational"

  /api_pilates/v1/login:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión
      description: |
        Autentica al usuario y genera un token JWT para usar en los demás endpoints.
        
        **Importante:**
        - Este endpoint **NO** requiere token
        - Siempre genera un nuevo token, invalidando cualquier token anterior
        - El token tiene una duración configurable (por defecto 12 horas)
        - Registra el dispositivo para notificaciones push si se envía `token_fmc`
        - Analiza automáticamente el User-Agent para identificar el dispositivo
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - login
                - password
                - token_fmc
              properties:
                login:
                  type: string
                  description: Email o nombre de usuario
                  example: "usuario@apnpilates.com"
                password:
                  type: string
                  format: password
                  description: Contraseña del usuario
                  example: "MiPassword123"
                token_fmc:
                  type: string
                  description: Token de Firebase Cloud Messaging para notificaciones push. Enviar cadena vacía si no desea notificaciones.
                  example: "fMC_token:APA91bH3k4j5..."
            examples:
              con_notificaciones:
                summary: Login con notificaciones push
                value:
                  login: "maria@apnpilates.com"
                  password: "Maria2024!"
                  token_fmc: "fMC_token:APA91bH3k4j5l8m9..."
              sin_notificaciones:
                summary: Login sin notificaciones
                value:
                  login: "juan@apnpilates.com"
                  password: "Juan2024!"
                  token_fmc: ""
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: ID del usuario
                        example: 42
                      name:
                        type: string
                        description: Nombre completo del usuario
                        example: "María García"
                      login:
                        type: string
                        description: Login/email del usuario
                        example: "maria@apnpilates.com"
                      token:
                        type: string
                        description: Token JWT para autenticación
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      token_expiration:
                        type: string
                        description: Fecha de expiración del token
                        example: "2024-01-02 12:00:00"
                  message:
                    type: string
                    example: "Sesión iniciada exitosamente"
              example:
                status: "success"
                user:
                  id: 42
                  name: "María García"
                  login: "maria@apnpilates.com"
                  token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjo0MiwibG9naW4iOiJtYXJpYS5nYXJjaWFAZWplbXBsby5jb20iLCJleHAiOjE3MDQxOTY0MDAsImlhdCI6MTcwNDExNjQwMH0.abc123..."
                  token_expiration: "2024-01-02 12:00:00"
                message: "Sesión iniciada exitosamente"
        '400':
          description: Datos inválidos o faltantes
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "error"
                  message:
                    type: string
                  data:
                    type: object
                    nullable: true
                  pagination:
                    type: object
                    nullable: true
              examples:
                parametros_faltantes:
                  summary: Parámetros faltantes
                  value:
                    status: "error"
                    message: "Falta el parámetro: login"
                    data: null
                    pagination: null
                credenciales_invalidas:
                  summary: Credenciales incorrectas
                  value:
                    status: "error"
                    message: "Invalid credentials"
                    data:
                      type: "AccessDenied"
                      message: "Invalid credentials"
                      file: ".../auth.py"
                      line: 123
                      function: "login"
                      text: "raise AccessDenied(_('Invalid credentials'))"
                    pagination: null
        '403':
          description: Usuario inactivo o bloqueado
          content:
            application/json:
              example:
                status: "error"
                message: "El usuario 'María García' no está activo. Contacte al administrador para activar esta cuenta."
                data: null
                pagination: null
        '500':
          description: Error interno del servidor
          content:
            application/json:
              example:
                status: "error"
                message: "Error interno del servidor"
                data:
                  type: "InternalError"
                  message: "Descripción del error"
                pagination: null

  /api_pilates/v1/logout:
    post:
      tags:
        - Autenticación
      summary: Cerrar sesión
      description: |
        Invalida el token JWT actual del usuario.
        
        **Comportamiento:**
        - Busca el token en la base de datos y lo elimina
        - Si el token está expirado pero es válido, igualmente limpia la sesión
        - No requiere que el token esté activo para procesar el logout
        
        **Importante:** El token JWT debe enviarse en el header `Authorization: Bearer TU_TOKEN`
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: El body puede ser un objeto vacío o contener datos adicionales
              example: { }
      responses:
        '200':
          description: Logout exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                  data:
                    type: object
                    nullable: true
                  pagination:
                    type: object
                    nullable: true
              examples:
                logout_exitoso:
                  summary: Sesión cerrada correctamente
                  value:
                    status: "success"
                    message: "Sesión cerrada correctamente"
                    data: null
                    pagination: null
                logout_token_expirado:
                  summary: Sesión cerrada (token expirado)
                  value:
                    status: "success"
                    message: "Sesión cerrada correctamente (token expirado)"
                    data: null
                    pagination: null
        '400':
          description: Token no proporcionado o inválido
          content:
            application/json:
              examples:
                sin_autorizacion:
                  summary: Header de autorización faltante
                  value:
                    status: "error"
                    message: "Encabezado de autorización inválido"
                    data: null
                    pagination: null
                token_invalido:
                  summary: Token inválido
                  value:
                    status: "error"
                    message: "Token inválido"
                    data: null
                    pagination: null
                usuario_no_encontrado:
                  summary: Usuario no encontrado
                  value:
                    status: "error"
                    message: "Usuario no encontrado en el sistema"
                    data: null
                    pagination: null
        '500':
          description: Error interno del servidor
          content:
            application/json:
              example:
                status: "error"
                message: "Error interno del servidor"
                data: null
                pagination: null

  /api_pilates/v1/branches:
    get:
      tags:
        - Sucursales
      summary: Listar todas las sucursales activas
      description: |
        Obtiene la lista completa de sucursales activas con toda su información relacionada.
        
        **Información incluida por sucursal:**
        - Datos generales (nombre, dirección, contacto)
        - Ubicación geográfica (latitud, longitud, enlace a Google Maps)
        - Logo de la sucursal (indicador y URL de descarga)
        - Salas disponibles con sus capacidades
        - Horarios de operación con días y horas
        
        **Nota sobre el logo:**
        - `logo`: indica si la sucursal tiene un logo configurado (true/false)
        - `logo_url`: URL completa para descargar la imagen del logo (null si no tiene logo)
        
        **Nota sobre los horarios:**
        - Los días se representan: 0=Lunes, 1=Martes, 2=Miércoles, 3=Jueves, 4=Viernes, 5=Sábado, 6=Domingo
        - Las horas están en formato 24h decimal (ej: 6.5 = 06:30, 17.5 = 17:30)
        - Un horario puede cubrir un rango de días (ej: Lunes a Viernes) o un solo día (ej: Solo Sábado)
        - Si `hour_to` es menor que `hour_from`, el horario cruza al día siguiente
      security: []
      responses:
        '200':
          description: Lista de sucursales obtenida exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Datos obtenidos correctamente"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Branch'
              example:
                status: "success"
                message: "Datos obtenidos correctamente"
                data:
                  - id: 3
                    name: "Sucursal A"
                    latitude: 20.6648948
                    longitude: -103.3938723
                    map_url: "https://www.google.com/maps?q=20.6648948,-103.3938723"
                    city: "Guadalajara"
                    phone: "(33) 1598 2647"
                    email: false
                    website: false
                    street: "Av. López Mateos Sur 4450"
                    street2: false
                    logo: true
                    logo_url: "http://localhost:8069/public/image/branch/3"
                    state:
                      id: 498
                      name: "Jalisco"
                    zip: "45040"
                    country:
                      id: 156
                      name: "Mexico"
                    parent_company:
                      id: 1
                      name: "Pilates"
                    reference: false
                    room_count: 3
                    rooms:
                      - id: 2
                        name: "Sala Cadillac"
                        capacity: 40
                      - id: 1
                        name: "Sala Flow"
                        capacity: 30
                      - id: 3
                        name: "Sala Wunda"
                        capacity: 25
                    schedules:
                      - id: 1
                        day_of_week_from: "0"
                        day_of_week_from_label: "Monday"
                        day_of_week_to: "4"
                        day_of_week_to_label: "Friday"
                        hour_from: 6
                        hour_to: 7
                      - id: 6
                        day_of_week_from: "0"
                        day_of_week_from_label: "Monday"
                        day_of_week_to: "4"
                        day_of_week_to_label: "Friday"
                        hour_from: 13
                        hour_to: 14
                  - id: 4
                    name: "Sucursal B"
                    latitude: 20.9798447
                    longitude: -89.6208458
                    map_url: "https://www.google.com/maps?q=20.9798447,-89.6208458"
                    city: "Mérida"
                    phone: "(999) 285 6143"
                    email: false
                    website: false
                    street: "Calle 60 476"
                    street2: "Calle 55"
                    logo: false
                    logo_url: null
                    state:
                      id: 515
                      name: "Yucatán"
                    zip: "97000"
                    country:
                      id: 156
                      name: "Mexico"
                    parent_company:
                      id: 1
                      name: "Pilates"
                    reference: false
                    room_count: 2
                    rooms:
                      - id: 9
                        name: "Sala Mat"
                        capacity: 25
                      - id: 8
                        name: "Sala Reformer"
                        capacity: 20
                    schedules:
                      - id: 4
                        day_of_week_from: "0"
                        day_of_week_from_label: "Monday"
                        day_of_week_to: "4"
                        day_of_week_to_label: "Friday"
                        hour_from: 9
                        hour_to: 10
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "error"
                  message:
                    type: string
                    example: "Error interno del servidor"
                  data:
                    type: object
                    nullable: true
                  pagination:
                    type: object
                    nullable: true
              example:
                status: "error"
                message: "Error interno del servidor"
                data: null
                pagination: null

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token obtenido mediante el endpoint de login

  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: "ERROR_CODE"
            message:
              type: string
              example: "Descripción del error"
            detail:
              type: string
              example: "Detalles adicionales"
        timestamp:
          type: string
          format: date-time

    Success:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "OK"
        data:
          type: object
        timestamp:
          type: string
          format: date-time

    Branch:
      type: object
      properties:
        id:
          type: integer
          description: ID único de la sucursal
          example: 3
        name:
          type: string
          description: Nombre de la sucursal
          example: "Sucursal A"
        latitude:
          type: number
          format: float
          description: Latitud geográfica
          example: 20.6648948
        longitude:
          type: number
          format: float
          description: Longitud geográfica
          example: -103.3938723
        map_url:
          type: string
          format: uri
          description: URL de Google Maps con la ubicación
          example: "https://www.google.com/maps?q=20.6648948,-103.3938723"
        city:
          type: string
          description: Ciudad donde se ubica la sucursal
          example: "Guadalajara"
        phone:
          type: string
          description: Número de teléfono
          example: "(33) 1598 2647"
        email:
          type: string
          nullable: true
          description: Correo electrónico de contacto
          example: "sucursal@ejemplo.com"
        website:
          type: string
          nullable: true
          description: Sitio web de la sucursal
          example: "https://sucursal.ejemplo.com"
        street:
          type: string
          description: Calle y número
          example: "Av. López Mateos Sur 4450"
        street2:
          type: string
          nullable: true
          description: Información adicional de dirección
          example: "Col. Jardines del Sol"
        logo:
          type: boolean
          description: Indica si la sucursal tiene un logo configurado
          example: true
        logo_url:
          type: string
          format: uri
          nullable: true
          description: |
            URL completa para descargar la imagen del logo de la sucursal.
            Es null cuando la sucursal no tiene logo configurado.
          example: "http://localhost:8069/public/image/branch/3"
        state:
          $ref: '#/components/schemas/State'
        zip:
          type: string
          description: Código postal
          example: "45040"
        country:
          $ref: '#/components/schemas/Country'
        parent_company:
          $ref: '#/components/schemas/ParentCompany'
        reference:
          type: string
          nullable: true
          description: Referencias o puntos de referencia cercanos
          example: "Frente al parque central"
        room_count:
          type: integer
          description: Número total de salas en la sucursal
          example: 3
        rooms:
          type: array
          description: Lista de salas disponibles
          items:
            $ref: '#/components/schemas/Room'
        schedules:
          type: array
          description: Horarios de operación de la sucursal
          items:
            $ref: '#/components/schemas/Schedule'

    State:
      type: object
      properties:
        id:
          type: integer
          description: ID del estado/provincia
          example: 498
        name:
          type: string
          description: Nombre del estado/provincia
          example: "Jalisco"

    Country:
      type: object
      properties:
        id:
          type: integer
          description: ID del país
          example: 156
        name:
          type: string
          description: Nombre del país
          example: "Mexico"

    ParentCompany:
      type: object
      properties:
        id:
          type: integer
          description: ID de la compañía padre
          example: 1
        name:
          type: string
          description: Nombre de la compañía padre
          example: "Pilates"

    Room:
      type: object
      properties:
        id:
          type: integer
          description: ID único de la sala
          example: 2
        name:
          type: string
          description: Nombre de la sala
          example: "Sala Cadillac"
        capacity:
          type: integer
          description: Capacidad máxima de personas
          example: 40
          minimum: 1

    Schedule:
      type: object
      properties:
        id:
          type: integer
          description: ID único del horario
          example: 1
        day_of_week_from:
          type: string
          description: |
            Día de inicio del horario.
            0=Lunes, 1=Martes, 2=Miércoles, 3=Jueves, 4=Viernes, 5=Sábado, 6=Domingo
          example: "0"
          enum: ["0", "1", "2", "3", "4", "5", "6"]
        day_of_week_from_label:
          type: string
          description: Etiqueta legible del día de inicio
          example: "Monday"
          enum: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"]
        day_of_week_to:
          type: string
          description: |
            Día de fin del horario.
            Puede ser igual que day_of_week_from si es un solo día
          example: "4"
          enum: ["0", "1", "2", "3", "4", "5", "6"]
        day_of_week_to_label:
          type: string
          description: Etiqueta legible del día de fin
          example: "Friday"
          enum: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"]
        hour_from:
          type: number
          format: float
          description: |
            Hora de inicio en formato 24h decimal.
            Ejemplos: 6.0 = 06:00, 13.5 = 13:30, 17.0 = 17:00
          example: 6
          minimum: 0
          maximum: 23.99
        hour_to:
          type: number
          format: float
          description: |
            Hora de fin en formato 24h decimal.
            Si es menor que hour_from, indica que cruza al día siguiente
          example: 7
          minimum: 0
          maximum: 23.99

tags:
  - name: Sistema
    description: Endpoints del sistema
  - name: Autenticación
    description: Endpoints relacionados con la autenticación de los usuarios en el sistema
  - name: Sucursales
    description: Endpoints relacionados con las sucursales, salas y horarios de operación
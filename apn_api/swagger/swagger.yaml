  /api_pilates/v1/accesories_branch:
    post:
      tags:
        - Accesorios
      summary: Listar accesorios por sucursal
      description: |
        Obtiene una lista paginada de accesorios activos disponibles en una sucursal específica.
        
        **Parámetros del cuerpo (obligatorio `branch_id`, opcionales `page` y `limit`):**
        - `branch_id`: ID de la sucursal (requerido)
        - `page`: número de página (por defecto 1)
        - `limit`: elementos por página (por defecto 80)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - branch_id
              properties:
                branch_id:
                  type: integer
                  description: ID de la sucursal para filtrar los accesorios
                  example: 3
                page:
                  type: integer
                  description: Número de página
                  example: 1
                  minimum: 1
                limit:
                  type: integer
                  description: Elementos por página
                  example: 80
                  minimum: 1
            example:
              branch_id: 3
              page: 1
              limit: 80
      responses:

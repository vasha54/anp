  /api_pilates/v1/password_reset_request:
    post:
      tags:
        - Usuario
      summary: Solicitar código de restablecimiento de contraseña
      description: |
        Genera un código de verificación y lo envía al email del usuario.  
        **Parámetros requeridos:** `email`
        
        **Comportamiento:**  
        - Si el email está registrado, se crea un código de un solo uso y se envía por correo electrónico.  
        - Por seguridad, siempre se responde con un mensaje genérico, independientemente de si el email existe o no.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
            example:
              email: "cliente@example.com"
      responses:
        '200':
          description: Solicitud procesada (el código se envió si el email existe)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Si el email está registrado, se ha enviado un código de restablecimiento."
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/PasswordResetUserData'
              example:
                success: true
                message: "Si el email está registrado, se ha enviado un código de restablecimiento."
                data:
                  user:
                    email: "cliente@example.com"
                    id: 87
                    name: "María López"
        '400':
          description: Parámetros faltantes o email no encontrado (el controlador lanza excepción si no existe)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "error"
                  message:
                    type: string
                  data:
                    type: object
                    nullable: true
                  pagination:
                    type: object
                    nullable: true
              examples:
                parametros_faltantes:
                  summary: Falta el parámetro email
                  value:
                    status: "error"
                    message: "Falta el parámetro: email"
                    data: null
                    pagination: null
                email_no_encontrado:
                  summary: No existe usuario con ese email
                  value:
                    status: "error"
                    message: "No se encontró ningún usuario con esa dirección de correo electrónico"
                    data: null
                    pagination: null
        '500':
          description: Error interno del servidor
          content:
            application/json:
              example:
                status: "error"
                message: "Error interno del servidor"
                data: null
                pagination: null

  /api_pilates/v1/password_reset_confirm:
    post:
      tags:
        - Usuario
      summary: Confirmar restablecimiento de contraseña
      description: |
        Cambia la contraseña utilizando el código de verificación recibido por email.  
        **Parámetros requeridos:** `email`, `code`, `new_password`
        
        **Validaciones:**  
        - El código debe ser válido y no haber expirado.  
        - La nueva contraseña debe cumplir la política de seguridad (mínimo 8 caracteres, mayúsculas, minúsculas, números y caracteres especiales).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
            example:
              email: "cliente@example.com"
              code: "123456"
              new_password: "Nueva.Clave1"
      responses:
        '200':
          description: Contraseña cambiada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "La contraseña se ha cambiado correctamente."
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/PasswordResetUserData'
              example:
                success: true
                message: "La contraseña se ha cambiado correctamente."
                data:
                  user:
                    email: "cliente@example.com"
                    id: 87
                    name: "María López"
        '400':
          description: Error de validación (código inválido, email no encontrado, contraseña débil, etc.)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "error"
                  message:
                    type: string
                  data:
                    type: object
                    nullable: true
                  pagination:
                    type: object
                    nullable: true
              examples:
                parametros_faltantes:
                  summary: Faltan parámetros requeridos
                  value:
                    status: "error"
                    message: "Falta el parámetro: email"
                    data: null
                    pagination: null
                email_no_encontrado:
                  summary: No existe usuario con ese email
                  value:
                    status: "error"
                    message: "No se encontró ningún usuario con esa dirección de correo electrónico"
                    data: null
                    pagination: null
                codigo_invalido:
                  summary: Código incorrecto o expirado
                  value:
                    status: "error"
                    message: "El código de restablecimiento no es válido o ha expirado."
                    data: null
                    pagination: null
                password_debil:
                  summary: La nueva contraseña no cumple los requisitos
                  value:
                    status: "error"
                    message: "La contraseña debe tener al menos 8 caracteres, incluir mayúsculas, minúsculas, números y caracteres especiales."
                    data: null
                    pagination: null
        '500':
          description: Error interno del servidor
          content:
            application/json:
              example:
                status: "error"
                message: "Error interno del servidor"
                data: null
                pagination: null

  # --------------------- Sucursales ---------------------
  /api_pilates/v1/branches:
    post:
      tags:
        - Sucursales
      summary: Listar todas las sucursales activas
      description: |
        Obtiene una lista paginada de sucursales activas con toda su información relacionada.
        
        **Parámetros del cuerpo (opcionales):**
        - `page`: número de página (por defecto 1)
        - `limit`: elementos por página (por defecto 80)
        
        **Información incluida por sucursal:**
        - Datos generales (nombre, dirección, contacto)
        - Ubicación geográfica (latitud, longitud, enlace a Google Maps)
        - Logo de la sucursal (indicador y URL de descarga)
        - Salas disponibles con sus capacidades
        - Horarios de operación con días y horas
        
        **Nota sobre el logo:**
        - `logo`: indica si la sucursal tiene un logo configurado (true/false)
        - `logo_url`: URL completa para descargar la imagen del logo (null si no tiene logo)
        
        **Nota sobre los horarios:**
        - Los días se representan: 0=Lunes, 1=Martes, 2=Miércoles, 3=Jueves, 4=Viernes, 5=Sábado, 6=Domingo
        - Las horas están en formato 24h decimal (ej: 6.5 = 06:30, 17.5 = 17:30)
        - Un horario puede cubrir un rango de días (ej: Lunes a Viernes) o un solo día (ej: Solo Sábado)
        - Si `hour_to` es menor que `hour_from`, el horario cruza al día siguiente
      security: [ ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                page:
                  type: integer
                  description: Número de página a recuperar
                  example: 1
                  minimum: 1
                limit:
                  type: integer
                  description: Cantidad de elementos por página
                  example: 80
                  minimum: 1
            example:
              page: 1
              limit: 80
      responses:
        '200':
          description: Lista de sucursales obtenida exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Datos obtenidos correctamente"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Branch'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              example:
                status: "success"
                message: "Datos obtenidos correctamente"
                data:
                  - id: 3
                    name: "Sucursal A"
                    latitude: 20.6648948
                    longitude: -103.3938723
                    map_url: "https://www.google.com/maps?q=20.6648948,-103.3938723"
                    city: "Guadalajara"
                    phone: "(33) 1598 2647"
                    email: false
                    website: false
                    street: "Av. López Mateos Sur 4450"
                    street2: false
                    logo: true
                    logo_url: "http://localhost:8069/public/image/branch/3"
                    state:
                      id: 498
                      name: "Jalisco"
                    zip: "45040"
                    country:
                      id: 156
                      name: "Mexico"
                    parent_company:
                      id: 1
                      name: "Pilates"
                    reference: false
                    room_count: 3
                    rooms:
                      - id: 2
                        name: "Sala Cadillac"
                        capacity: 40
                      - id: 1
                        name: "Sala Flow"
                        capacity: 30
                      - id: 3
                        name: "Sala Wunda"
                        capacity: 25
                    schedules:
                      - id: 1
                        day_of_week_from: "0"
                        day_of_week_from_label: "Monday"
                        day_of_week_to: "4"
                        day_of_week_to_label: "Friday"
                        hour_from: 6
                        hour_to: 7
                      - id: 6
                        day_of_week_from: "0"
                        day_of_week_from_label: "Monday"
                        day_of_week_to: "4"
                        day_of_week_to_label: "Friday"
                        hour_from: 13
                        hour_to: 14
                pagination:
                  page: 1
                  limit: 80
                  total_items: 6
                  total_pages: 1
                  offset: 0
        '400':
          description: Error en los parámetros (ej. página o límite no numéricos)
          content:
            application/json:
              example:
                status: "error"
                message: "Error en los parámetros"
                data: null
                pagination: null
        '500':
          description: Error interno del servidor
          content:
            application/json:
              example:
                status: "error"
                message: "Error interno del servidor"
                data: null
                pagination: null


                    purchase_ok: false
                    type: "product"
                    type_str: "Storable Product"
                    uom_id: 1
                    uom_name: "Units"
                    image_1920: true
                    image_1920_url: "http://localhost:8069/public/image/product_accesorie/42"
                    is_favorite: false
                    product_tags:
                      - id: 3
                        name: "Nuevo"
                        color: 4
                    tax_string: "IVA 16%"
                    standard_price: 20.0
                    taxes:
                      - id: 1
                        name: "IVA 16%"
                        amount: 16.0
                        type_tax_use: "sale"
                        description: ""
                        amount_type: "percent"
                        price_include: false
                    categ:
                      id: 5
                      name: "Accesorios"
                    barcode: "7501234567890"
                    companies:
                      - id: 3
                        name: "Sucursal A"
                    attribute_lines:
                      - id: 12
                        sequence: 1
                        attribute_id: 2
                        attribute_name: "Color"
                        value_count: 3
                        value_ids:
                          - id: 45
                            name: "Azul"
                            color: 4
                            sequence: 1
                    product_tmpl:
                      id: 10
                      name: "Mat Pilates Premium"
                    description_sale: "Mat de pilates profesional"
                    qty_available: 15
                    variant_values:
                      - id: 55
                        attribute_id: 2
                        attribute_name: "Color"
                        value_id: 45
                        value_name: "Azul"
                        value_color: 4
                        price_extra: 0.0
                pagination:
                  page: 1
                  limit: 80
                  total_items: 45
                  total_pages: 1
                  offset: 0
        '400':
          description: Error en los parámetros (ej. falta branch_id)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "error"
                  message:
                    type: string
                    example: "Falta el parámetro: branch_id"
                  data:
                    type: object
                    nullable: true
                  pagination:
                    type: object
                    nullable: true
              example:
                status: "error"
                message: "Falta el parámetro: branch_id"
                data: null
                pagination: null
        '500':
          description: Error interno del servidor
          content:
            application/json:
              example:
                status: "error"
                message: "Error interno del servidor"
                data: null
                pagination: null

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token obtenido mediante el endpoint de login

  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: "ERROR_CODE"
            message:
              type: string
              example: "Descripción del error"
            detail:
              type: string
              example: "Detalles adicionales"
        timestamp:
          type: string
          format: date-time

    Success:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "OK"
        data:
          type: object
        timestamp:
          type: string
          format: date-time

    Branch:
      type: object
      properties:
        id:
          type: integer
          description: ID único de la sucursal
          example: 3
        name:
          type: string
          description: Nombre de la sucursal
          example: "Sucursal A"
        latitude:
          type: number
          format: float
          description: Latitud geográfica
          example: 20.6648948
        longitude:
          type: number
          format: float
          description: Longitud geográfica
          example: -103.3938723
        map_url:
          type: string
          format: uri
          description: URL de Google Maps con la ubicación
          example: "https://www.google.com/maps?q=20.6648948,-103.3938723"
        city:
          type: string
          description: Ciudad donde se ubica la sucursal
          example: "Guadalajara"
        phone:
          type: string
          description: Número de teléfono
          example: "(33) 1598 2647"
        email:
          type: string
          nullable: true
          description: Correo electrónico de contacto
          example: "sucursal@ejemplo.com"
        website:
          type: string
          nullable: true
          description: Sitio web de la sucursal
          example: "https://sucursal.ejemplo.com"
        street:
          type: string
          description: Calle y número
          example: "Av. López Mateos Sur 4450"
        street2:
          type: string
          nullable: true
          description: Información adicional de dirección
          example: "Col. Jardines del Sol"
        logo:
          type: boolean
          description: Indica si la sucursal tiene un logo configurado
          example: true
        logo_url:
          type: string
          format: uri
          nullable: true
          description: |
            URL completa para descargar la imagen del logo de la sucursal.
            Es null cuando la sucursal no tiene logo configurado.
          example: "http://localhost:8069/public/image/branch/3"
        state:
          $ref: '#/components/schemas/State'
        zip:
          type: string
          description: Código postal
          example: "45040"
        country:
          $ref: '#/components/schemas/Country'
        parent_company:
          $ref: '#/components/schemas/ParentCompany'
        reference:
          type: string
          nullable: true
          description: Referencias o puntos de referencia cercanos
          example: "Frente al parque central"
        room_count:
          type: integer
          description: Número total de salas en la sucursal
          example: 3
        rooms:
          type: array
          description: Lista de salas disponibles
          items:
            $ref: '#/components/schemas/Room'
        schedules:
          type: array
          description: Horarios de operación de la sucursal
          items:
            $ref: '#/components/schemas/Schedule'

    State:
      type: object
      properties:
        id:
          type: integer
          description: ID del estado/provincia
          example: 498
        name:
          type: string
          description: Nombre del estado/provincia
          example: "Jalisco"

    Country:
      type: object
      properties:
        id:
          type: integer
          description: ID del país
          example: 156
        name:
          type: string
          description: Nombre del país
          example: "Mexico"

    ParentCompany:
      type: object
      properties:
        id:
          type: integer
          description: ID de la compañía padre
          example: 1
        name:
          type: string
          description: Nombre de la compañía padre
          example: "Pilates"

    Room:
      type: object
      properties:
        id:
          type: integer
          description: ID único de la sala
          example: 2
        name:
          type: string
          description: Nombre de la sala
          example: "Sala Cadillac"
        capacity:
          type: integer
          description: Capacidad máxima de personas
          example: 40
          minimum: 1

    Schedule:
      type: object
      properties:
        id:
          type: integer
          description: ID único del horario
          example: 1
        day_of_week_from:
          type: string
          description: |
            Día de inicio del horario.
            0=Lunes, 1=Martes, 2=Miércoles, 3=Jueves, 4=Viernes, 5=Sábado, 6=Domingo
          example: "0"
          enum: ["0", "1", "2", "3", "4", "5", "6"]
        day_of_week_from_label:
          type: string
          description: Etiqueta legible del día de inicio
          example: "Monday"
          enum: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"]
        day_of_week_to:
          type: string
          description: |
            Día de fin del horario.
            Puede ser igual que day_of_week_from si es un solo día
          example: "4"
          enum: ["0", "1", "2", "3", "4", "5", "6"]
        day_of_week_to_label:
          type: string
          description: Etiqueta legible del día de fin
          example: "Friday"
          enum: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"]
        hour_from:
          type: number
          format: float
          description: |
            Hora de inicio en formato 24h decimal.
            Ejemplos: 6.0 = 06:00, 13.5 = 13:30, 17.0 = 17:00
          example: 6
          minimum: 0
          maximum: 23.99
        hour_to:
          type: number
          format: float
          description: |
            Hora de fin en formato 24h decimal.
            Si es menor que hour_from, indica que cruza al día siguiente
          example: 7
          minimum: 0
          maximum: 23.99

    ProductAccessory:
      type: object
      properties:
        id:
          type: integer
          description: ID del producto
          example: 42
        name:
          type: string
          description: Nombre del producto
          example: "Mat Pilates Premium"
        display_name:
          type: string
          description: Nombre completo mostrado (incluye variante)
          example: "Mat Pilates Premium (Azul)"
        default_code:
          type: string
          description: Código interno del producto
          example: "MAT001"
        list_price:
          type: number
          format: float
          description: Precio de venta
          example: 35.0
        lst_price:
          type: number
          format: float
          description: Precio de lista (igual a list_price)
          example: 35.0
        description:
          type: string
          description: Descripción del producto (HTML)
          example: "<p>Mat de pilates de alta densidad</p>"
        sale_ok:
          type: boolean
          description: Permite venta
          example: true
        purchase_ok:
          type: boolean
          description: Permite compra
          example: false
        type:
          type: string
          description: Tipo de producto (código)
          example: "product"
          enum: ["product", "consu", "service"]
        type_str:
          type: string
          description: Tipo de producto legible
          example: "Storable Product"
        uom_id:
          type: integer
          description: ID de la unidad de medida
          example: 1
        uom_name:
          type: string
          description: Nombre de la unidad de medida
          example: "Units"
        image_1920:
          type: boolean
          description: Indica si el producto tiene imagen
          example: true
        image_1920_url:
          type: string
          format: uri
          nullable: true
          description: URL de la imagen del producto
          example: "http://localhost:8069/public/image/product_accesorie/42"
        is_favorite:
          type: boolean
          description: Producto marcado como favorito
          example: false
        product_tags:
          type: array
          nullable: true
          description: Etiquetas del producto
          items:
            $ref: '#/components/schemas/ProductTag'
        tax_string:
          type: string
          description: Resumen de impuestos
          example: "IVA 16%"
        standard_price:
          type: number
          format: float
          description: Costo estándar
          example: 20.0
        taxes:
          type: array
          nullable: true
          description: Lista de impuestos aplicables
          items:
            $ref: '#/components/schemas/Tax'
        categ:
          $ref: '#/components/schemas/Category'
        barcode:
          type: string
          description: Código de barras
          example: "7501234567890"
        companies:
          type: array
          nullable: true
          description: Compañías a las que está asignado el producto
          items:
            $ref: '#/components/schemas/CompanySimple'
        attribute_lines:
          type: array
          nullable: true
          description: Líneas de atributos de la plantilla
          items:
            $ref: '#/components/schemas/AttributeLine'
        product_tmpl:
          $ref: '#/components/schemas/ProductTemplate'
        description_sale:
          type: string
          description: Descripción de venta
          example: "Mat de pilates profesional"
        qty_available:
          type: number
          format: float
          description: Cantidad disponible
          example: 25
        variant_values:
          type: array
          nullable: true
          description: Valores de atributos de esta variante
          items:
            $ref: '#/components/schemas/VariantValue'

    ProductTag:
      type: object
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: "Nuevo"
        color:
          type: integer
          description: Índice de color (1-12)
          example: 4

    Tax:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "IVA 16%"
        amount:
          type: number
          example: 16.0
        type_tax_use:
          type: string
          enum: ["sale", "purchase", "none"]
          example: "sale"
        description:
          type: string
          example: ""
        amount_type:
          type: string
          enum: ["percent", "fixed", "division", "group"]
          example: "percent"
        price_include:
          type: boolean
          example: false

    Category:
      type: object
      properties:
        id:
          type: integer
          example: 5
        name:
          type: string
          example: "Accesorios"

    CompanySimple:
      type: object
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: "Sucursal A"

    AttributeLine:
      type: object
      properties:
        id:
          type: integer
          example: 12
        sequence:
          type: integer
          example: 1
        attribute_id:
          type: integer
          example: 2
        attribute_name:
          type: string
          example: "Color"
        value_count:
          type: integer
          example: 3
        value_ids:
          type: array
          items:
            $ref: '#/components/schemas/AttributeValue'

    AttributeValue:
      type: object
      properties:
        id:
          type: integer
          example: 45
        name:
          type: string
          example: "Azul"
        color:
          type: integer
          example: 4
        sequence:
          type: integer
          example: 1

    ProductTemplate:
      type: object
      properties:
        id:
          type: integer
          example: 10
        name:
          type: string
          example: "Mat Pilates Premium"

    VariantValue:
      type: object
      properties:
        id:
          type: integer
          example: 55
        attribute_id:
          type: integer
          example: 2
        attribute_name:
          type: string
          example: "Color"
        value_id:
          type: integer
          example: 45
        value_name:
          type: string
          example: "Azul"
        value_color:
          type: integer
          example: 4
        price_extra:
          type: number
          format: float
          example: 0.0

    UserProfile:
      type: object
      properties:
        id:
          type: integer
          description: ID del usuario
          example: 9
        name:
          type: string
          description: Nombre completo
          example: "Soporte Técnico APN Pilates"
        login:
          type: string
          description: Email o nombre de usuario
          example: "soporte@apnpilates.com"
        active:
          type: boolean
          description: Indica si el usuario está activo
          example: true
        apn_groups:
          type: array
          description: Grupos de seguridad del usuario
          items:
            type: object
            properties:
              id:
                type: integer
                example: 64
              name:
                type: string
                example: "APN Pilates Administrator"
        email:
          type: string
          nullable: true
          description: Correo electrónico adicional
          example: false
        mobile:
          type: string
          nullable: true
          description: Número de móvil
          example: false
        partner:
          type: array
          description: Datos del contacto asociado (res.partner)
          items:
            type: object
            properties:
              id:
                type: integer
                example: 10
              name:
                type: string
                example: "Soporte Técnico APN Pilates"

    Pagination:
      type: object
      properties:
        page:
          type: integer
          description: Página actual
          example: 1
        limit:
          type: integer
          description: Elementos por página
          example: 80
        total_items:
          type: integer
          description: Total de registros encontrados
          example: 120
        total_pages:
          type: integer
          description: Total de páginas
          example: 2
        offset:
          type: integer
          description: Desplazamiento aplicado
          example: 0

tags:
  - name: Sistema
    description: Endpoints del sistema
  - name: Autenticación
    description: Endpoints relacionados con la autenticación de los usuarios en el sistema
  - name: Sucursales
    description: Endpoints relacionados con las sucursales, salas y horarios de operación
  - name: Accesorios
    description: Endpoints para consultar el catálogo de accesorios con paginación y filtro por sucursal
  - name: Usuario
    description: Endpoints para gestión del perfil de usuario
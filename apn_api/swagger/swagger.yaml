        - `limit`: elementos por página (por defecto 80)
        
        **Estructura de cada producto:** Incluye información detallada como etiquetas, impuestos, categoría, compañías, atributos, variantes e imágenes.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                page:
                  type: integer
                  description: Número de página a recuperar
                  example: 1
                  minimum: 1
                limit:
                  type: integer
                  description: Cantidad de elementos por página

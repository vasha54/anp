components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token obtenido mediante el endpoint de login

  schemas:
    # --------------------- Esquemas existentes ---------------------
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: "ERROR_CODE"
            message:
              type: string
              example: "Descripción del error"
            detail:
              type: string
              example: "Detalles adicionales"
        timestamp:
          type: string
          format: date-time

    Success:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "OK"
        data:
          type: object
        timestamp:
          type: string
          format: date-time

    Branch:
      type: object
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: "Sucursal A"
        latitude:
          type: number
          example: 20.6648948
        longitude:
          type: number
          example: -103.3938723
        map_url:
          type: string
          example: "https://www.google.com/maps?q=20.6648948,-103.3938723"
        city:
          type: string
          example: "Guadalajara"
        phone:
          type: string
          example: "(33) 1598 2647"
        email:
          type: string
          nullable: true
          example: false
        website:
          type: string
          nullable: true
          example: false
        street:
          type: string
          example: "Av. López Mateos Sur 4450"
        street2:
          type: string
          nullable: true
          example: false
        logo:
          type: boolean
          example: true
        logo_url:
          type: string
          nullable: true
          example: "http://localhost:8069/public/image/branch/3"
        state:
          $ref: '#/components/schemas/State'
        zip:
          type: string
          example: "45040"
        country:
          $ref: '#/components/schemas/Country'
        parent_company:
          $ref: '#/components/schemas/ParentCompany'
        reference:
          type: string
          nullable: true
          example: false
        room_count:
          type: integer
          example: 3
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/Room'
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/Schedule'

    State:
      type: object
      properties:
        id:
          type: integer
          example: 498
        name:
          type: string
          example: "Jalisco"

    Country:
      type: object
      properties:
        id:
          type: integer
          example: 156
        name:
          type: string
          example: "Mexico"

    ParentCompany:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Pilates"

    Room:
      type: object
      properties:
        id:
          type: integer
          example: 2
        name:
          type: string
          example: "Sala Cadillac"
        capacity:
          type: integer
          example: 40

    Schedule:
      type: object
      properties:
        id:
          type: integer
          example: 1
        day_of_week_from:
          type: string
          example: "0"
          enum: ["0", "1", "2", "3", "4", "5", "6"]
        day_of_week_from_label:
          type: string
          example: "Monday"
        day_of_week_to:
          type: string
          example: "4"
          enum: ["0", "1", "2", "3", "4", "5", "6"]
        day_of_week_to_label:
          type: string
          example: "Friday"
        hour_from:
          type: number
          example: 6
        hour_to:
          type: number
          example: 7

    ProductAccessory:
      type: object
      properties:
        id:
          type: integer
          example: 42
        name:
          type: string
          example: "Mat Pilates Premium"
        display_name:
          type: string
          example: "Mat Pilates Premium (Azul)"
        default_code:
          type: string
          example: "MAT001"
        list_price:
          type: number
          example: 35.0
        lst_price:
          type: number
          example: 35.0
        description:
          type: string
          example: "<p>Mat de pilates de alta densidad</p>"
        sale_ok:
          type: boolean
          example: true
        purchase_ok:
          type: boolean
          example: false
        type:
          type: string
          example: "product"
        type_str:
          type: string
          example: "Storable Product"
        uom_id:
          type: integer
          example: 1
        uom_name:
          type: string
          example: "Units"
        image_1920:
          type: boolean
          example: true
        image_1920_url:
          type: string
          nullable: true
          example: "http://localhost:8069/public/image/product_accesorie/42"
        is_favorite:
          type: boolean
          example: false
        product_tags:
          type: array
          items:
            $ref: '#/components/schemas/ProductTag'
        tax_string:
          type: string
          example: "IVA 16%"
        standard_price:
          type: number
          example: 20.0
        taxes:
          type: array
          items:
            $ref: '#/components/schemas/Tax'
        categ:
          $ref: '#/components/schemas/Category'
        barcode:
          type: string
          example: "7501234567890"
        companies:
          type: array
          items:
            $ref: '#/components/schemas/CompanySimple'
        attribute_lines:
          type: array
          items:
            $ref: '#/components/schemas/AttributeLine'
        product_tmpl:
          $ref: '#/components/schemas/ProductTemplate'
        description_sale:
          type: string
          example: "Mat de pilates profesional"
        qty_available:
          type: number
          example: 25
        variant_values:
          type: array
          items:
            $ref: '#/components/schemas/VariantValue'

    ProductTag:
      type: object
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: "Nuevo"
        color:
          type: integer
          example: 4

    Tax:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "IVA 16%"
        amount:
          type: number
          example: 16.0
        type_tax_use:
          type: string
          example: "sale"
        description:
          type: string
          example: ""
        amount_type:
          type: string
          example: "percent"
        price_include:
          type: boolean
          example: false

    Category:
      type: object
      properties:
        id:
          type: integer
          example: 5
        name:
          type: string
          example: "Accesorios"

    CompanySimple:
      type: object
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: "Sucursal A"

    AttributeLine:
      type: object
      properties:
        id:
          type: integer
          example: 12
        sequence:
          type: integer
          example: 1
        attribute_id:
          type: integer
          example: 2
        attribute_name:
          type: string
          example: "Color"
        value_count:
          type: integer
          example: 3
        value_ids:
          type: array
          items:
            $ref: '#/components/schemas/AttributeValue'

    AttributeValue:
      type: object
      properties:
        id:
          type: integer
          example: 45
        name:
          type: string
          example: "Azul"
        color:
          type: integer
          example: 4
        sequence:
          type: integer
          example: 1

    ProductTemplate:
      type: object
      properties:
        id:
          type: integer
          example: 10
        name:
          type: string
          example: "Mat Pilates Premium"

    VariantValue:
      type: object
      properties:
        id:
          type: integer
          example: 55
        attribute_id:
          type: integer
          example: 2
        attribute_name:
          type: string
          example: "Color"
        value_id:
          type: integer
          example: 45
        value_name:
          type: string
          example: "Azul"
        value_color:
          type: integer
          example: 4
        price_extra:
          type: number
          example: 0.0

    UserProfile:
      type: object
      properties:
        id:
          type: integer
          example: 9
        name:
          type: string
          example: "Soporte Técnico APN Pilates"
        login:
          type: string
          example: "soporte@apnpilates.com"
        active:
          type: boolean
          example: true
        apn_groups:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 64
              name:
                type: string
                example: "APN Pilates Administrator"
        email:
          type: string
          nullable: true
          example: false
        mobile:
          type: string
          nullable: true
          example: false
        google_profile_picture:
          type: string
          nullable: true
          example: null
        partner:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 10
              name:
                type: string
                example: "Soporte Técnico APN Pilates"

    RegisterClientRequest:
      type: object
      required:
        - email
        - password
        - confirmed_password
        - name
      properties:
        email:
          type: string
          format: email
          example: "cliente@example.com"
        password:
          type: string
          format: password
          example: "Clave.123"
        confirmed_password:
          type: string
          format: password
          example: "Clave.123"
        name:
          type: string
          example: "María López"
        login:
          type: string
          example: "maria.lopez"
        mobile:
          type: string
          example: "+34600123456"

    UserRegistrationData:
      type: object
      properties:
        id:
          type: integer
          example: 87
        name:
          type: string
          example: "María López"
        email:
          type: string
          format: email
          example: "cliente@example.com"
        is_activated:
          type: boolean
          example: false
        activation_email_sent:
          type: boolean
          example: true
        login:
          type: string
          example: "maria.lopez"

    AccountActivateRequest:
      type: object
      required:
        - email
        - token
      properties:
        email:
          type: string
          format: email
          example: "cliente@example.com"
        token:
          type: string
          example: "abc123def456..."

    AccountActivateData:
      type: object
      properties:
        id:
          type: integer
          example: 87
        name:
          type: string
          example: "María López"
        email:
          type: string
          format: email
          example: "cliente@example.com"
        is_activated:
          type: boolean
          example: true

    ChangePasswordRequest:
      type: object
      required:
        - password
        - confirmed_password
      properties:
        password:
          type: string
          format: password
          example: "Nueva.Clave1"
        confirmed_password:
          type: string
          format: password
          example: "Nueva.Clave1"

    ChangePasswordResponseData:
      type: object
      properties:
        id:
          type: integer
          example: 42
        name:
          type: string
          example: "María García"
        login:
          type: string
          example: "maria@apnpilates.com"

    PasswordResetRequestRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "cliente@example.com"

    PasswordResetConfirmRequest:
      type: object
      required:
        - email
        - code
        - new_password
      properties:
        email:
          type: string
          format: email
          example: "cliente@example.com"
        code:
          type: string
          example: "123456"
        new_password:
          type: string
          format: password
          example: "Nueva.Clave1"

    PasswordResetUserData:
      type: object
      properties:
        email:
          type: string
          format: email
          example: "cliente@example.com"
        id:
          type: integer
          example: 87
        name:
          type: string
          example: "María López"

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 80
        total_items:
          type: integer
          example: 120
        total_pages:
          type: integer
          example: 2
        offset:
          type: integer
          example: 0

    # --------------------- NUEVOS ESQUEMAS: Aplicación Móvil ---------------------
    MobilePlatform:
      type: object
      properties:
        id:
          type: integer
          description: ID de la plataforma
          example: 1
        name:
          type: string
          description: Nombre de la plataforma (iOS, Android, etc.)
          example: "iOS"
        code:
          type: string
          description: Código interno único
          example: "ios"
        active:
          type: boolean
          description: Indica si la plataforma está activa
          example: true

    MobileVersion:
      type: object
      properties:
        id:
          type: integer
          description: ID único de la versión
          example: 10
        version:
          type: string
          description: Número de versión (ej. "2.1.0")
          example: "2.1.0"
        platform_id:
          type: integer
          description: ID de la plataforma asociada
          example: 1
        platform_code:
          type: string
          description: Código de la plataforma
          example: "ios"
        platform_name:
          type: string
          description: Nombre de la plataforma
          example: "iOS"
        release_date:
          type: string
          format: date
          description: Fecha de lanzamiento (YYYY-MM-DD)
          example: "2024-05-20"
        download_url:
          type: string
          format: uri
          description: URL de descarga de la app
          example: "https://apps.apple.com/app/id123456"
        is_mandatory:
          type: boolean
          description: Indica si la actualización es obligatoria
          example: true
        release_notes:
          type: string
          description: Notas de la versión (HTML)
          example: "<p>Corrección de errores y mejoras de rendimiento</p>"
        display_name:
          type: string
          description: Nombre completo para mostrar
          example: "Pilates - iOS v2.1.0"
        company:
          type: object
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: "Pilates"

    # Request schemas for mobile endpoints
    GetVersionsRequest:
      type: object
      properties:
        platform_code:
          type: string
          description: Código de plataforma para filtrar (opcional)
          example: "ios"

    GetLatestVersionRequest:
      type: object
      required:
        - platform_code
      properties:
        platform_code:
          type: string
          description: Código de la plataforma
          example: "android"

    GetVersionsByCompanyRequest:
      type: object
      required:
        - company_id
      properties:
        company_id:
          type: integer
          description: ID de la compañía (res.company)
          example: 1

    GetVersionsByCompanyAndPlatformRequest:
      type: object
      required:
        - company_id
        - platform_code
      properties:
        company_id:
          type: integer
          example: 1
        platform_code:
          type: string
          example: "ios"

    GetLatestVersionsByCompanyRequest:
      type: object
      required:
        - company_id
      properties:
        company_id:
          type: integer
          example: 1

    GetLatestVersionByCompanyAndPlatformRequest:
      type: object
      required:
        - company_id
        - platform_code
      properties:
        company_id:
          type: integer
          example: 1
        platform_code:
          type: string
          example: "android"


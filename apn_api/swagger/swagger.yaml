openapi: 3.0.0
info:
  title: APN Pilates API REST
  description: |
    API REST para el sistema APN Pilates
    
    ## Autenticación
    
    Para usar los endpoints protegidos, debes incluir el token en el header:
    `Authorization: Bearer TU_TOKEN_AQUI`
    
    ## Flujo de uso
    
    1. Obtén un token mediante el endpoint `/api/v1/auth/login`
    2. Usa ese token en los demás endpoints en el header Authorization

  version: 1.0.0
  contact:
    name: APN Pilates
    email: soporte@apnpilates.com
  license:
    name: LGPL-3.0

servers:
  - url: http://localhost:8069
    description: Servidor de desarrollo

security:
  - BearerAuth: []

paths:
  /api_pilates/v1/status:
    get:
      tags:
        - Sistema
      summary: Estado de la API
      description: Verifica que la API está funcionando correctamente
      security: []
      responses:
        '200':
          description: API funcionando correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      api_version:
                        type: string
                        example: "1.0"
                      status:
                        type: string
                        example: "operational"
              example:
                success: true
                message: "OK"
                data:
                  api_version: "1.0"
                  odoo_version: "18.0"
                  status: "operational"

